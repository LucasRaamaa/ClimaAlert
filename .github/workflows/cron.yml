name: ClimaAlert Cronjob

on:
  # Descomenta las siguientes dos líneas cuando quieras que se empiece a ejecutar automáticamente en GitHub:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:
    # Esto permite ejecutar el script manualmente desde el botón en la web de GitHub Actions

jobs:
  run-clima-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código (Checkout)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ejecutar script de ClimaAlert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: ${{ secrets.ENABLE_TELEGRAM || 'true' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python backend/main.py

      - name: Guardar estado Anti-Spam
        run: |
          git config --global user.name "ClimaAlert Bot"
          git config --global user.email "bot@climaalert.com"
          git add backend/estado.json
          git commit -m "[Bot] Actualiza estado de alerta" || echo "Sin cambios en el estado"
          git push
